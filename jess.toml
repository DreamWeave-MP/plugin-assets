manifest_version = 1

[package]
id = "org.dreamweave.plugin-assets"
version = "0.1.0"
jess_api = "1"
default_target = "plugin-assets"
include = ["src"]
tests = ["tests/run.luau", "tests/commands.luau", "tests/cli.luau", "tests/style.luau"]

[dependencies]
"org.dreamweave.tes3" = "0.1"
"org.dreamweave.vfs" = "0.1"
"org.dreamweave.nif-assets" = "0.1"

# The suite builds its models with the NIF module, packs an archive with the archive module, and
# hands the package what a real load order opens: a Context's plugins and its VFS.
[dev-dependencies]
"org.dreamweave.nif" = "0.1"
"org.dreamweave.dream-archive" = "0.1"
"org.dreamweave.load-order" = "0.1"
"org.dreamweave.openmw" = "0.1"

[modules]
"@plugin-assets" = "src/init.luau"
"@plugin-assets/commands" = "src/commands.luau"
"@plugin-assets/cli" = "src/cli.luau"

# Every module here is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. A check reads the models its plugins use, and says where the
# files they load are on disk, so its caller needs `filesystem.read`; `commands` reads the plugins
# and lists the data folders as well, under the same capability.

[[layer]]
id = "plugin-assets.core"
requires = ["tes3.core", "vfs.core", "nif-assets.core"]
exports = ["@plugin-assets", "@plugin-assets/commands", "@plugin-assets/cli"]

# The command line `jess plugin assets` had: `src/main.luau` hands its arguments to
# `@plugin-assets/cli`. A check reads the plugins named, lists their folders and the --data
# folders, opens the --data archives, reads the models the plugins use, and resolves where each
# file used is on disk (filesystem.read). It writes no file, reads no environment (there is no
# openmw.cfg behind it to find), runs no other program, and opens no connection.

[targets.plugin-assets]
kind = "command"
command = "plugin-assets"
entry = "src/main.luau"
capabilities = ["filesystem.read"]
